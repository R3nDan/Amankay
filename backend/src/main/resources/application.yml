spring:
  application:
    name: amankay-backend
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true
    create-schemas: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: "${AMANKAY_SESSION_COOKIE_SECURE:false}"

amankay:
  frontend-origin: "${AMANKAY_FRONTEND_ORIGIN:http://localhost:3000}"
  orders:
    expiry-sweep-ms: 60000
  qr:
    session-ttl: "${AMANKAY_QR_SESSION_TTL:PT8H}"
    expiry-sweep-ms: 60000
  private-files-dir: "${AMANKAY_PRIVATE_FILES_DIR:}"
